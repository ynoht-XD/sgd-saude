<style>
  #modal-edicao-apac {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, .55);
    z-index: 9999;
    padding: 18px;
  }

  #modal-edicao-apac .modal-card {
    width: min(1180px, 98vw);
    max-height: 92vh;
    overflow: hidden;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
    display: flex;
    flex-direction: column;
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid #e5e7eb;
    background: #f8fafc;
  }

  .modal-head h3 {
    margin: 0;
    color: #0f172a;
    font-size: 1.15rem;
  }

  .icon-btn {
    border: none;
    background: #e5e7eb;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
  }

  .modal-body {
    overflow: auto;
    padding: 16px 18px;
  }

  .modal-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tab-btn {
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    color: #334155;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 800;
  }

  .tab-btn.active {
    background: #1f4e85;
    color: #fff;
    border-color: #1f4e85;
  }

  .tab-panel {
    display: none;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 14px;
    background: #fff;
  }

  .tab-panel.active {
    display: block;
  }

  .section-title {
    font-weight: 900;
    color: #1f4e85;
    margin: 0 0 12px;
    font-size: 1rem;
  }

  .grid {
    display: grid;
    gap: 12px;
    margin-bottom: 12px;
  }

  .two { grid-template-columns: repeat(2, 1fr); }
  .three { grid-template-columns: repeat(3, 1fr); }
  .four { grid-template-columns: repeat(4, 1fr); }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: .78rem;
    color: #475569;
    font-weight: 800;
    text-transform: uppercase;
  }

  .field input,
  .field select,
  .field textarea {
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 9px 10px;
    font-size: .95rem;
    outline: none;
    background: #fff;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: #1f4e85;
    box-shadow: 0 0 0 3px rgba(31, 78, 133, .12);
  }

  .field textarea {
    min-height: 80px;
    resize: vertical;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 14px 18px;
    border-top: 1px solid #e5e7eb;
    background: #f8fafc;
  }

  .btn {
    border: 1px solid #d1d5db;
    background: #fff;
    padding: 9px 13px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 800;
  }

  .btn.primary {
    background: #1f4e85;
    color: #fff;
    border-color: #1f4e85;
  }

  @media (max-width: 850px) {
    .two, .three, .four {
      grid-template-columns: 1fr;
    }
  }
</style>

<div id="modal-edicao-apac" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-apac">
  <form class="modal-card" method="post" action="{{ url_for('export.apac_atualizar') }}" id="form-edicao-apac">
    <div class="modal-head">
      <h3 id="titulo-modal-apac">Editar APAC</h3>
      <button class="icon-btn js-close" type="button" aria-label="Fechar">×</button>
    </div>

    <div class="modal-body">
      <input type="hidden" id="id_apac_editar" name="id_apac">

      <div class="modal-tabs">
        <button type="button" class="tab-btn active" data-tab="tab-apac">APAC</button>
        <button type="button" class="tab-btn" data-tab="tab-paciente">Paciente</button>
        <button type="button" class="tab-btn" data-tab="tab-nf">Nota Fiscal</button>
        <button type="button" class="tab-btn" data-tab="tab-entrega">Entrega</button>
        <button type="button" class="tab-btn" data-tab="tab-execucao">Execução</button>
        <button type="button" class="tab-btn" data-tab="tab-obs">Observações</button>
      </div>

      <div class="tab-panel active" id="tab-apac">
        <div class="section-title">Dados da APAC</div>

        <div class="grid four">
          <div class="field"><label>Nº APAC</label><input name="numero_apac" type="text"></div>
          <div class="field"><label>Competência</label><input name="competencia" type="text" placeholder="MM/AAAA"></div>
          <div class="field"><label>Código Procedimento</label><input name="codigo_procedimento" type="text"></div>
          <div class="field"><label>Quantidade</label><input name="quantidade" type="number" min="1"></div>
        </div>

        <div class="grid two">
          <div class="field"><label>Procedimento</label><input name="procedimento" type="text"></div>
          <div class="field"><label>CNES</label><input name="cnes" type="text"></div>
        </div>

        <div class="grid four">
          <div class="field"><label>Data Inicial</label><input name="data_inicial" type="date"></div>
          <div class="field"><label>Data Final</label><input name="data_final" type="date"></div>
          <div class="field"><label>Tipo APAC</label><input name="tipo_apac" type="text"></div>
          <div class="field"><label>Nacionalidade</label><input name="nacionalidade" type="text"></div>
        </div>

        <div class="grid three">
          <div class="field"><label>Status Nota</label>
            <select name="status">
              <option value="">Selecione</option>
              <option value="Em aberto">Em aberto</option>
              <option value="Pago">Pago</option>
            </select>
          </div>
          <div class="field"><label>CID Principal</label><input name="cid" type="text"></div>
          <div class="field"><label>CID Secundário</label><input name="cid2" type="text"></div>
        </div>

        <div class="field">
          <label>Descrição do Diagnóstico</label>
          <textarea name="descricao_diagnostico"></textarea>
        </div>
      </div>

      <div class="tab-panel" id="tab-paciente">
        <div class="section-title">Paciente</div>

        <div class="grid four">
          <div class="field"><label>Nome</label><input name="nome_paciente" type="text"></div>
          <div class="field"><label>CNS</label><input name="cns_paciente" type="text"></div>
          <div class="field"><label>CPF</label><input name="cpf_paciente" type="text"></div>
          <div class="field"><label>Nascimento</label><input name="data_nascimento" type="date"></div>
        </div>

        <div class="grid three">
          <div class="field"><label>Nome da Mãe</label><input name="nome_mae" type="text"></div>
          <div class="field"><label>Responsável</label><input name="responsavel" type="text"></div>
          <div class="field"><label>Sexo</label><input name="sexo" type="text"></div>
        </div>

        <div class="grid four">
          <div class="field"><label>Raça</label><input name="raca" type="text"></div>
          <div class="field"><label>Endereço</label><input name="endereco" type="text"></div>
          <div class="field"><label>Número</label><input name="numero" type="text"></div>
          <div class="field"><label>Bairro</label><input name="bairro" type="text"></div>
        </div>

        <div class="grid two">
          <div class="field"><label>CEP</label><input name="cep" type="text"></div>
          <div class="field"><label>Prontuário</label><input name="prontuario" type="text"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-nf">
        <div class="section-title">Nota Fiscal / Faturamento</div>

        <div class="grid four">
          <div class="field"><label>Nº Nota Fiscal</label><input name="nota_fiscal" type="text"></div>
          <div class="field"><label>Data da NF</label><input name="data_nota_fiscal" type="date"></div>
          <div class="field"><label>Entrada da NF</label><input name="data_entrada_nf" type="date"></div>
          <div class="field"><label>Competência da Nota</label><input name="competencia_nota" type="text" placeholder="MM/AAAA"></div>
        </div>

        <div class="grid three">
          <div class="field"><label>Protocolo Nota</label><input name="protocolo_nota" type="text"></div>
          <div class="field"><label>Fornecedor</label><input name="fornecedor" type="text"></div>
          <div class="field"><label>Status Nota</label>
            <select name="status">
              <option value="">Selecione</option>
              <option value="Em aberto">Em aberto</option>
              <option value="Pago">Pago</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Observação Nota</label>
          <textarea name="obs_nota"></textarea>
        </div>
      </div>

      <div class="tab-panel" id="tab-entrega">
        <div class="section-title">Entrega</div>

        <div class="grid three">
          <div class="field"><label>Data Entrega</label><input name="data_entrega" type="date"></div>
          <div class="field"><label>Local Entrega</label><input name="local_entrega" type="text"></div>
          <div class="field"><label>Status Entrega</label>
            <select name="status_entrega">
              <option value="">Selecione</option>
              <option value="Na instituição">Na instituição</option>
              <option value="Entregue">Entregue</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Observação Entrega</label>
          <textarea name="obs_entrega"></textarea>
        </div>
      </div>

      <div class="tab-panel" id="tab-execucao">
        <div class="section-title">Execução / Profissionais</div>

        <div class="grid four">
          <div class="field"><label>CBO Executante</label><input name="cbo_executante" type="text"></div>
          <div class="field"><label>CNS Executante</label><input name="cns_executante" type="text"></div>
          <div class="field"><label>Serviço</label><input name="servico" type="text"></div>
          <div class="field"><label>Classificação</label><input name="classificacao" type="text"></div>
        </div>

        <div class="grid three">
          <div class="field"><label>Nome Solicitante</label><input name="nome_solicitante" type="text"></div>
          <div class="field"><label>CNS Solicitante</label><input name="cns_solicitante" type="text"></div>
          <div class="field"><label>Data Solicitação</label><input name="data_solicitacao" type="date"></div>
        </div>

        <div class="grid three">
          <div class="field"><label>Nome Autorizador</label><input name="nome_autorizador" type="text"></div>
          <div class="field"><label>CNS Autorizador</label><input name="cns_autorizador" type="text"></div>
          <div class="field"><label>Data Autorização</label><input name="data_autorizacao" type="date"></div>
        </div>

        <div class="field">
          <label>Órgão Emissor</label>
          <input name="orgao_emissor" type="text">
        </div>
      </div>

      <div class="tab-panel" id="tab-obs">
        <div class="section-title">Observações Gerais</div>
        <div class="field">
          <label>Observações</label>
          <textarea name="obs_geral"></textarea>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn js-close">Cancelar</button>
      <button type="submit" class="btn primary">Salvar alterações</button>
    </div>
  </form>
</div>

<script>
  window.fecharModal = function () {
    const modal = document.querySelector("#modal-edicao-apac");
    if (modal) {
      modal.style.display = "none";
      document.body.style.overflow = "";
    }
  };

  document.addEventListener("click", function (e) {
    const tab = e.target.closest(".tab-btn");
    if (!tab) return;

    const modal = tab.closest("#modal-edicao-apac");
    const target = tab.dataset.tab;

    modal.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    modal.querySelectorAll(".tab-panel").forEach(panel => panel.classList.remove("active"));

    tab.classList.add("active");
    modal.querySelector("#" + target)?.classList.add("active");
  });
</script>
